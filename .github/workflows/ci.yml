name: CI

# GPUI desktop (the shipping Windows app) plus compile checks for the macOS and
# Linux paths in crates/gpui-desktop. Mobile stays in mobile.yml and is unchanged:
# library-ffi, the iOS and Android apps, and the ios-v* / android-v* releases.
on:
  push:
    branches: [feat/gpui-desktop, main]
    tags: ["v*"]
  pull_request:
    branches: [feat/gpui-desktop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests and the package build must not call the update endpoint.
  EGL_SKIP_UPDATE_CHECK: "1"

jobs:
  # Branch pushes, pull requests, and manual runs. A version tag only packages
  # and publishes; it does not repeat this job.
  check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      # Decode-only: default `hevc` pulls GPL x265 (D-070). Remove any prior
      # default-feature install on the runner before installing [core,libde265],
      # otherwise vcpkg may leave an x265-linked heif that breaks the link line.
      - name: libheif (HEIC/HEIF previews, D-063)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          vcpkg remove "libheif:x64-windows" --recurse 2>$null
          vcpkg remove "x265:x64-windows" --recurse 2>$null
          $ErrorActionPreference = "Stop"
          # A native command's exit code does not stop pwsh, and vcpkg gives up at once on
          # some network errors (a TLS failure fetching a source tarball): retry, then fail here.
          $installed = $false
          foreach ($attempt in 1..3) {
            vcpkg install "libheif[core,libde265]:x64-windows"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) {
              Write-Warning "vcpkg install failed (exit $LASTEXITCODE, attempt $attempt of 3); retrying"
              Start-Sleep -Seconds (20 * $attempt)
            }
          }
          if (-not $installed) { throw "vcpkg install libheif failed after 3 attempts" }
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $lib = Join-Path $root "installed\x64-windows\lib"
          $bin = Join-Path $root "installed\x64-windows\bin"
          foreach ($name in @("libx265.lib", "x265.lib", "libx265.dll", "x265.dll")) {
            foreach ($dir in @($lib, $bin)) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) {
                throw "Unexpected GPL x265 artefact after decode-only install: $path"
              }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "heif.dll"))) { throw "heif.dll missing under $bin" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "libde265.dll"))) { throw "libde265.dll missing under $bin" }
          Write-Host "Decode-only libheif OK (no x265) under $root"

      - uses: ./.github/actions/ffmpeg-windows

      # libheif-sys finds the vcpkg tree only through VCPKG_ROOT; the runner image
      # exports VCPKG_INSTALLATION_ROOT instead. VCPKGRS_DYNAMIC=1 selects the
      # x64-windows (DLL) triplet, matching `vcpkg install` above; without it
      # vcpkg-rs demands its x64-windows-static-md default, which we don't build.
      - name: vcpkg env for libheif-sys
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"

      - name: libheif on PATH for tests
        shell: bash
        run: echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      # Bust caches that still emit cargo:rustc-link-lib=x265 from an older
      # default-feature libheif install (LNK1181 libx265.lib).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: heif-core-libde265-ffmpeg-v2

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace

  # Portable Windows layout (D-133). Also the artifact a v* tag publishes.
  gpui-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: libheif (HEIC/HEIF previews, D-063)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          vcpkg remove "libheif:x64-windows" --recurse 2>$null
          vcpkg remove "x265:x64-windows" --recurse 2>$null
          $ErrorActionPreference = "Stop"
          # A native command's exit code does not stop pwsh, and vcpkg gives up at once on
          # some network errors (a TLS failure fetching a source tarball): retry, then fail here.
          $installed = $false
          foreach ($attempt in 1..3) {
            vcpkg install "libheif[core,libde265]:x64-windows"
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) {
              Write-Warning "vcpkg install failed (exit $LASTEXITCODE, attempt $attempt of 3); retrying"
              Start-Sleep -Seconds (20 * $attempt)
            }
          }
          if (-not $installed) { throw "vcpkg install libheif failed after 3 attempts" }
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $lib = Join-Path $root "installed\x64-windows\lib"
          $bin = Join-Path $root "installed\x64-windows\bin"
          foreach ($name in @("libx265.lib", "x265.lib", "libx265.dll", "x265.dll")) {
            foreach ($dir in @($lib, $bin)) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) {
                throw "Unexpected GPL x265 artefact after decode-only install: $path"
              }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "heif.dll"))) { throw "heif.dll missing under $bin" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "libde265.dll"))) { throw "libde265.dll missing under $bin" }

      - uses: ./.github/actions/ffmpeg-windows

      - name: vcpkg env for libheif-sys
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"

      - name: libheif on PATH for tests
        shell: bash
        run: echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: heif-core-libde265-ffmpeg-v2-gpui

      - name: Test gpui-desktop
        run: cargo test --locked -p gpui-desktop

      - name: Package portable GPUI desktop
        shell: pwsh
        run: |
          ./scripts/package-gpui-desktop.ps1
          if (-not (Test-Path -LiteralPath dist/gpui-desktop/gpui-desktop.exe)) {
            throw "gpui-desktop.exe missing from portable stage"
          }
          foreach ($name in @("heif.dll", "libde265.dll")) {
            if (-not (Test-Path -LiteralPath "dist/gpui-desktop/$name")) {
              throw "$name missing from portable stage"
            }
          }
          foreach ($name in @("libx265.dll", "x265.dll")) {
            if (Test-Path -LiteralPath "dist/gpui-desktop/$name") {
              throw "GPL x265 DLL must not ship in the portable layout: $name"
            }
          }
          Get-ChildItem dist/gpui-desktop
          Get-ChildItem dist -Filter "egl-viewer-gpui_*.zip"

      - name: Upload GPUI portable zip
        uses: actions/upload-artifact@v4
        with:
          name: gpui-desktop-portable
          path: |
            dist/egl-viewer-gpui_*.zip
            dist/gpui-desktop/**
          if-no-files-found: error

  # Same shell, Linux backend (Wayland/X11, fontconfig, freetype). Workspace tests
  # here cover the unix cfgs; gpui-desktop's own tests stay on Windows because
  # device_query needs a session, and the bin is only built.
  gpui-linux:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libclang-dev \
            libheif-dev \
            libheif-plugin-libde265 \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libasound2-dev \
            libpcsclite-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxtst-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            libdbus-1-dev
          pkg-config --exists libheif
          pkg-config --exists fontconfig
          pkg-config --exists freetype2
          pkg-config --exists wayland-client
          pkg-config --exists xkbcommon
          pkg-config --exists libpcsclite
          pkg-config --exists libavcodec libavformat libavfilter libswscale libswresample alsa

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gpui-linux-v1

      - name: Workspace tests (without the GPUI bin)
        run: cargo test --locked --workspace --exclude gpui-desktop

      - name: Build gpui-desktop
        run: |
          set -euo pipefail
          cargo build --locked -p gpui-desktop
          test -x target/debug/gpui-desktop
          file target/debug/gpui-desktop

  # Same shell, macOS backend (Metal). Compile only: Windows runs the suite,
  # Linux runs the unix tests.
  gpui-macos:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: libheif (HEIC/HEIF previews, D-063)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          set -euo pipefail
          brew install pkg-config libheif ffmpeg
          prefix="$(brew --prefix libheif)"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" pkg-config --exists libheif
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" pkg-config --modversion libheif

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gpui-macos-v1

      - name: Build gpui-desktop
        run: |
          set -euo pipefail
          cargo build --locked -p gpui-desktop
          test -x target/debug/gpui-desktop
          file target/debug/gpui-desktop

  # A version tag vX.Y.Z publishes one GitHub Release with the portable zip and
  # latest-gpui.json, marked latest so the in-app updater finds it (D-062, D-133).
  # Notes come from docs/releases/X.Y.Z.md. ios-v* and android-v* are mobile.yml.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gpui-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the portable zip
        uses: actions/download-artifact@v4
        with:
          name: gpui-desktop-portable
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CONF="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$VERSION" != "$CONF" ]]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $CONF" >&2
            exit 1
          fi
          NOTES="docs/releases/$VERSION.md"
          test -f "$NOTES" || { echo "missing $NOTES" >&2; exit 1; }
          mapfile -t zips < <(find dist -type f -name "egl-viewer-gpui_*_x64.zip")
          if [[ "${#zips[@]}" -ne 1 ]]; then
            echo "expected one egl-viewer-gpui zip, found ${#zips[@]}" >&2
            find dist -type f -print >&2
            exit 1
          fi
          mkdir release
          cp "${zips[0]}" "release/egl-viewer-gpui_${VERSION}_x64.zip"
          BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          node scripts/write-latest-gpui-json.mjs --version "$VERSION" --out release/latest-gpui.json \
            --notes "egl-viewer $VERSION" \
            --windows-x86_64 "url=$BASE/egl-viewer-gpui_${VERSION}_x64.zip"
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "egl-viewer v$VERSION" --notes-file "$NOTES" --verify-tag --latest
