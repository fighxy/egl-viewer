name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          git add --intent-to-add ui/src/ipc/generated
          git diff --exit-code -- ui/src/ipc/generated

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: UI tests
        run: pnpm test

      - name: Build the app
        run: pnpm tauri build --no-bundle

  # Windows NSIS installer. The check job above only compiles (--no-bundle).
  # Run this job by hand for a release: gh workflow run ci.yml --ref main
  nsis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the NSIS installer
        run: pnpm build

      - name: Upload the NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
