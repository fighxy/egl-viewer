name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      # Decode-only: default `hevc` pulls GPL x265 (D-070). Remove any prior
      # default-feature install on the runner before installing [core,libde265],
      # otherwise vcpkg may leave an x265-linked heif that breaks the link line.
      - name: libheif (HEIC/HEIF previews, D-063)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          vcpkg remove "libheif:x64-windows" --recurse 2>$null
          vcpkg remove "x265:x64-windows" --recurse 2>$null
          $ErrorActionPreference = "Stop"
          vcpkg install "libheif[core,libde265]:x64-windows"
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $lib = Join-Path $root "installed\x64-windows\lib"
          $bin = Join-Path $root "installed\x64-windows\bin"
          foreach ($name in @("libx265.lib", "x265.lib", "libx265.dll", "x265.dll")) {
            foreach ($dir in @($lib, $bin)) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) {
                throw "Unexpected GPL x265 artefact after decode-only install: $path"
              }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "heif.dll"))) { throw "heif.dll missing under $bin" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "libde265.dll"))) { throw "libde265.dll missing under $bin" }
          Write-Host "Decode-only libheif OK (no x265) under $root"

      # libheif-sys finds the vcpkg tree only through VCPKG_ROOT; the runner image
      # exports VCPKG_INSTALLATION_ROOT instead. VCPKGRS_DYNAMIC=1 selects the
      # x64-windows (DLL) triplet, matching `vcpkg install` above; without it
      # vcpkg-rs demands its x64-windows-static-md default, which we don't build.
      - name: vcpkg env for libheif-sys
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"

      - name: libheif on PATH for tests
        shell: bash
        run: echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      # Stage before any cargo/tauri step: tauri-build reads tauri.windows.conf.json
      # during clippy/test/build and requires the listed DLL paths to exist (D-070).
      - name: Stage libheif DLLs for the Windows bundle config
        shell: pwsh
        run: |
          ./scripts/bundle-heif-dlls.ps1
          if (-not (Test-Path -LiteralPath src-tauri/heif-runtime/heif.dll)) {
            throw "heif.dll was not staged"
          }
          if (-not (Test-Path -LiteralPath src-tauri/heif-runtime/libde265.dll)) {
            throw "libde265.dll was not staged"
          }
          Get-Content src-tauri/heif-runtime/bundled-dlls.txt

      # Bust caches that still emit cargo:rustc-link-lib=x265 from an older
      # default-feature libheif install (LNK1181 libx265.lib).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: heif-core-libde265-v1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Windows libheif bundle config (D-070)
        run: node scripts/check-heif-windows-bundle.mjs

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Generated TypeScript types are up to date
        shell: bash
        run: |
          git add --intent-to-add ui/src/ipc/generated
          git diff --exit-code -- ui/src/ipc/generated

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: UI tests
        run: pnpm test

      - name: Build the app
        run: pnpm tauri build --no-bundle

  # Windows NSIS installer. The check job above only compiles (--no-bundle).
  # A version tag (v*) builds the installer; workflow_dispatch does the same.
  nsis:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      # Same decode-only install as the check job (D-070).
      - name: libheif (HEIC/HEIF previews, D-063)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          vcpkg remove "libheif:x64-windows" --recurse 2>$null
          vcpkg remove "x265:x64-windows" --recurse 2>$null
          $ErrorActionPreference = "Stop"
          vcpkg install "libheif[core,libde265]:x64-windows"
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $lib = Join-Path $root "installed\x64-windows\lib"
          $bin = Join-Path $root "installed\x64-windows\bin"
          foreach ($name in @("libx265.lib", "x265.lib", "libx265.dll", "x265.dll")) {
            foreach ($dir in @($lib, $bin)) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) {
                throw "Unexpected GPL x265 artefact after decode-only install: $path"
              }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "heif.dll"))) { throw "heif.dll missing under $bin" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "libde265.dll"))) { throw "libde265.dll missing under $bin" }
          Write-Host "Decode-only libheif OK (no x265) under $root"

      # libheif-sys finds the vcpkg tree only through VCPKG_ROOT; the runner image
      # exports VCPKG_INSTALLATION_ROOT instead. VCPKGRS_DYNAMIC=1 selects the
      # x64-windows (DLL) triplet, matching `vcpkg install` above; without it
      # vcpkg-rs demands its x64-windows-static-md default, which we don't build.
      - name: vcpkg env for libheif-sys
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"

      - name: libheif on PATH for tests
        shell: bash
        run: echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: heif-core-libde265-v1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # TODO(D-062): set repository secrets TAURI_SIGNING_PRIVATE_KEY (and optional
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD) before the next version tag. createUpdaterArtifacts
      # requires them; without them this job fails on purpose.
      - name: Require updater signing secret
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY. Generate with 'pnpm tauri signer generate',"
            echo "put the public key in src-tauri/tauri.conf.json, and store the private key as that secret."
            exit 1
          fi

      # Copy heif.dll / libde265.dll (+ LGPL notices) into src-tauri/heif-runtime/
      # so NSIS installs them beside egl-viewer.exe (D-070).
      - name: Stage libheif DLLs beside the app
        shell: pwsh
        run: |
          ./scripts/bundle-heif-dlls.ps1
          if (-not (Test-Path -LiteralPath src-tauri/heif-runtime/heif.dll)) {
            throw "heif.dll was not staged"
          }
          if (-not (Test-Path -LiteralPath src-tauri/heif-runtime/libde265.dll)) {
            throw "libde265.dll was not staged"
          }
          Get-Content src-tauri/heif-runtime/bundled-dlls.txt

      - name: Build the NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build

      - name: Upload the NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          # Workspace target dir. Tauri does not write this bundle under src-tauri/target.
          # .sig files are the minisign signatures the in-app updater verifies (D-062).
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # macOS DMG. tauri.conf.json lists only the NSIS target, so this job asks for dmg.
  # macos-latest is Apple Silicon; the artifact is the aarch64 disk image.
  dmg:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: libheif (HEIC/HEIF previews, D-063)
        run: brew install libheif

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing secret
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY (see nsis job / D-062)."
            exit 1
          fi

      - name: Build the DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          # .app.tar.gz (+ .sig) is what the updater downloads; the DMG is for first installs.
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # Linux AppImage. The config has no Linux bundle; AppImage is the single file for a release.
  # Ubuntu 22.04 is the oldest hosted runner that still ships WebKitGTK 4.1, so the glibc
  # baseline stays as low as Tauri's AppImage guidance allows. Deprecated, still runnable
  # until 2027-04-17.
  appimage:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libpcsclite-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # Jammy ships libheif 1.12, libheif-rs needs >= 1.17 (D-063). The author's PPA
      # covers Jammy; if its version ever lags, the build fails here on purpose.
      - name: libheif from the strukturag PPA (HEIC/HEIF previews, D-063)
        run: |
          sudo add-apt-repository -y ppa:strukturag/libheif
          sudo apt-get update
          sudo apt-get install -y libheif-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing secret
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY (see nsis job / D-062)."
            exit 1
          fi

      - name: Build the AppImage
        env:
          # GitHub runners have no FUSE device. linuxdeploy's own AppImage must extract and run.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
