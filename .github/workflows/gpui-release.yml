name: GPUI Release

# Multi-platform GPUI desktop packages (Windows / Linux / macOS).
# Tag prefix `gpui-v*` is separate from:
#   - `v*`        → CI release (Tauri / legacy portable; do not mark GPUI Latest)
#   - `ios-v*`    → Mobile IPA
#   - `android-v*`→ Mobile APK/AAB
# Tag pushes publish a GitHub prerelease that is never marked Latest and never
# writes Tauri `latest.json` or touches `ios-latest`. On a real `gpui-v*` publish
# only, the rolling `gpui-latest` prerelease is updated with `latest-gpui.json`
# (points at the Windows NSIS setup; zip/tarball URLs optional).
# workflow_dispatch and pull_request are dry-run by default (build + artifacts only;
# never create/update a release or gpui-latest).
# pull_request is included so a branch that is not yet on `main` can still be verified;
# the Actions UI "Run workflow" dropdown can also target this branch after merge.
on:
  push:
    tags: ["gpui-v*"]
  pull_request:
    branches: [feat/gpui-desktop]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (false = dry-run: artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gpui-release-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EGL_SKIP_UPDATE_CHECK: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          CONF="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$CONF"
          if [[ "$GITHUB_REF" == refs/tags/gpui-v* ]]; then
            VERSION="$(bash scripts/gpui-release-version.sh "$GITHUB_REF_NAME")"
            if [[ "$VERSION" != "$CONF" ]]; then
              echo "tag $GITHUB_REF_NAME is $VERSION, but Cargo.toml says $CONF" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$CONF"
            echo "tag=" >> "$GITHUB_OUTPUT"
            # Only an explicit workflow_dispatch publish=true can publish without a tag,
            # and that path still requires a gpui-v* tag in the publish job.
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "GPUI package version $VERSION (publish=$(grep publish= "$GITHUB_OUTPUT" | cut -d= -f2))"

  windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: libheif (HEIC/HEIF previews, D-063)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          vcpkg remove "libheif:x64-windows" --recurse 2>$null
          vcpkg remove "x265:x64-windows" --recurse 2>$null
          $ErrorActionPreference = "Stop"
          vcpkg install "libheif[core,libde265]:x64-windows"
          $root = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $lib = Join-Path $root "installed\x64-windows\lib"
          $bin = Join-Path $root "installed\x64-windows\bin"
          foreach ($name in @("libx265.lib", "x265.lib", "libx265.dll", "x265.dll")) {
            foreach ($dir in @($lib, $bin)) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) {
                throw "Unexpected GPL x265 artefact after decode-only install: $path"
              }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "heif.dll"))) { throw "heif.dll missing under $bin" }
          if (-not (Test-Path -LiteralPath (Join-Path $bin "libde265.dll"))) { throw "libde265.dll missing under $bin" }

      - name: vcpkg env for libheif-sys
        shell: bash
        run: |
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}" >> "$GITHUB_ENV"
          echo "VCPKGRS_DYNAMIC=1" >> "$GITHUB_ENV"
          echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gpui-release-windows-v1

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisBin = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path -LiteralPath (Join-Path $nsisBin "makensis.exe"))) {
            $nsisBin = "${env:ProgramFiles}\NSIS"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $nsisBin "makensis.exe"))) {
            throw "makensis.exe missing after NSIS install"
          }
          echo $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package portable zip + NSIS setup
        shell: pwsh
        run: |
          ./scripts/package-gpui-desktop.ps1
          $version = "${{ needs.version.outputs.version }}"
          $zip = "dist/egl-viewer-gpui_${version}_x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "missing $zip" }
          if (-not (Test-Path -LiteralPath dist/gpui-desktop/gpui-desktop.exe)) {
            throw "gpui-desktop.exe missing from portable stage"
          }
          foreach ($name in @("heif.dll", "libde265.dll")) {
            if (-not (Test-Path -LiteralPath "dist/gpui-desktop/$name")) {
              throw "$name missing from portable stage"
            }
          }
          foreach ($name in @("libx265.dll", "x265.dll")) {
            if (Test-Path -LiteralPath "dist/gpui-desktop/$name") {
              throw "GPL x265 DLL must not ship: $name"
            }
          }
          # Stable multi-platform name for the gpui-v* channel.
          Copy-Item -LiteralPath $zip -Destination "dist/egl-viewer-gpui_${version}_windows-x64.zip" -Force

          # Per-user NSIS from the same stage (D-153). Unsigned on purpose.
          ./scripts/package-gpui-nsis.ps1 -StageDir dist/gpui-desktop -Version $version
          $setup = "dist/egl-viewer-gpui_${version}_windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "missing $setup" }
          Get-ChildItem dist -Filter "egl-viewer-gpui_*"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpui-windows-x64
          path: |
            dist/egl-viewer-gpui_${{ needs.version.outputs.version }}_windows-x64.zip
            dist/egl-viewer-gpui_${{ needs.version.outputs.version }}_windows-x64-setup.exe
          if-no-files-found: error

  linux:
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libclang-dev \
            libheif-dev \
            libheif-plugin-libde265 \
            libpcsclite-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxtst-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            libdbus-1-dev
          pkg-config --exists libheif
          pkg-config --exists libpcsclite

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gpui-release-linux-v1

      - name: Package Linux tarball
        run: |
          set -euo pipefail
          chmod +x scripts/package-gpui-linux.sh scripts/gpui-release-version.sh
          bash scripts/package-gpui-linux.sh
          VERSION="${{ needs.version.outputs.version }}"
          test -f "dist/egl-viewer-gpui_${VERSION}_linux-x86_64.tar.gz"
          ls -lh dist/egl-viewer-gpui_*

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-linux-x86_64
          path: |
            dist/egl-viewer-gpui_${{ needs.version.outputs.version }}_linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: libheif (HEIC/HEIF previews, D-063)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          set -euo pipefail
          brew install pkg-config libheif
          prefix="$(brew --prefix libheif)"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" pkg-config --exists libheif
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" pkg-config --modversion libheif

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gpui-release-macos-v1

      - name: Package macOS .app zip
        run: |
          set -euo pipefail
          chmod +x scripts/package-gpui-macos.sh scripts/gpui-release-version.sh
          bash scripts/package-gpui-macos.sh
          VERSION="${{ needs.version.outputs.version }}"
          # macos-latest is Apple Silicon.
          test -f "dist/egl-viewer-gpui_${VERSION}_macos-aarch64.zip"
          ls -lh dist/egl-viewer-gpui_*

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-macos-aarch64
          path: |
            dist/egl-viewer-gpui_${{ needs.version.outputs.version }}_macos-aarch64.zip
          if-no-files-found: error

  # Tag pushes always publish. workflow_dispatch only when inputs.publish=true.
  # Never marks the release as Latest; never touches Tauri latest.json / ios-latest /
  # android releases. Updates rolling gpui-latest with latest-gpui.json only here.
  publish:
    if: needs.version.outputs.publish == 'true'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files
        id: assemble
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "publish=true on workflow_dispatch without a gpui-v* tag is not supported" >&2
            echo "Push a gpui-vX.Y.Z tag to publish." >&2
            exit 1
          fi
          mkdir -p release channel
          win="$(find artifacts -type f -name "egl-viewer-gpui_${VERSION}_windows-x64.zip" | head -n1)"
          setup="$(find artifacts -type f -name "egl-viewer-gpui_${VERSION}_windows-x64-setup.exe" | head -n1)"
          linux="$(find artifacts -type f -name "egl-viewer-gpui_${VERSION}_linux-x86_64.tar.gz" | head -n1)"
          mac="$(find artifacts -type f -name "egl-viewer-gpui_${VERSION}_macos-aarch64.zip" | head -n1)"
          test -n "$win" && test -n "$setup" && test -n "$linux" && test -n "$mac"
          cp "$win" "release/egl-viewer-gpui_${VERSION}_windows-x64.zip"
          cp "$setup" "release/egl-viewer-gpui_${VERSION}_windows-x64-setup.exe"
          cp "$linux" "release/egl-viewer-gpui_${VERSION}_linux-x86_64.tar.gz"
          cp "$mac" "release/egl-viewer-gpui_${VERSION}_macos-aarch64.zip"
          (
            cd release
            sha256sum \
              "egl-viewer-gpui_${VERSION}_windows-x64.zip" \
              "egl-viewer-gpui_${VERSION}_windows-x64-setup.exe" \
              "egl-viewer-gpui_${VERSION}_linux-x86_64.tar.gz" \
              "egl-viewer-gpui_${VERSION}_macos-aarch64.zip" \
              > SHA256SUMS
          )
          NOTES="docs/releases/$VERSION.md"
          {
            echo "egl-viewer GPUI desktop $VERSION (prerelease), built from ${GITHUB_SHA::7}."
            echo
            echo "Platforms: Windows x64 per-user NSIS setup + portable zip, Linux x86_64 tarball, macOS Apple Silicon .app zip (unsigned)."
            echo "Install path (Windows): %LOCALAPPDATA%\\Programs\\egl-viewer-gpui (display name \"egl-viewer (GPUI)\")."
            echo "Authenticode / notarization / minisign remain deferred."
            echo
            if [[ -f "$NOTES" ]]; then
              cat "$NOTES"
              echo
            else
              echo "No docs/releases/$VERSION.md; changelog generated from the previous gpui-v* tag when available."
              echo
            fi
            echo "Check downloads: \`sha256sum -c SHA256SUMS\`."
          } > release/notes.md
          # Manifest for the rolling gpui-latest channel (not attached to this tag release).
          BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          node scripts/write-latest-gpui-json.mjs \
            --version "$VERSION" \
            --notes "egl-viewer GPUI $VERSION" \
            --out channel/latest-gpui.json \
            --windows-x86_64 "url=$BASE/egl-viewer-gpui_${VERSION}_windows-x64-setup.exe" \
            --linux-x86_64 "url=$BASE/egl-viewer-gpui_${VERSION}_linux-x86_64.tar.gz" \
            --macos-aarch64 "url=$BASE/egl-viewer-gpui_${VERSION}_macos-aarch64.zip"
          ls -lh release channel
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.assemble.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          PREVIOUS="$(git tag --list 'gpui-v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          ARGS=(
            --title "egl-viewer GPUI $VERSION"
            --notes-file release/notes.md
            --verify-tag
            --prerelease
            --latest=false
          )
          if [[ -n "$PREVIOUS" ]]; then
            ARGS+=(--generate-notes --notes-start-tag "$PREVIOUS")
          fi
          # Guard: updater manifests live only on the rolling gpui-latest release.
          if compgen -G 'release/latest*.json' > /dev/null; then
            echo "refusing to publish updater manifests on gpui-v* versioned releases" >&2
            exit 1
          fi
          gh release create "$TAG" release/* "${ARGS[@]}"

      - name: Update rolling gpui-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ steps.assemble.outputs.tag }}"
          NOTES="GPUI updater channel for $VERSION (from $TAG / ${GITHUB_SHA::7}). Not GitHub Latest — Tauri keeps releases/latest. Signature empty until minisign is wired."
          if gh release view gpui-latest >/dev/null 2>&1; then
            gh release upload gpui-latest channel/latest-gpui.json --clobber
            gh release edit gpui-latest \
              --title "GPUI latest (prerelease channel)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false
          else
            gh release create gpui-latest channel/latest-gpui.json \
              --title "GPUI latest (prerelease channel)" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi
