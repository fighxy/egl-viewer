name: Mobile

# iOS app + Android A1 foundation + library-ffi (D-082–D-084, D-092–D-101).
# Parallel to the Windows desktop `CI` workflow; does not replace it.
# A tag `ios-vX.Y.Z` builds and tests the iPhone app and publishes a GitHub Release with the
# unsigned IPA (D-100); path filters do not apply to tag pushes.
on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "crates/library-ffi/**"
      - "crates/app-service/**"
      - "crates/library-native/**"
      - "crates/library-core/**"
      - "crates/media/**"
      - "scripts/check-mobile-shell.sh"
      - "scripts/check-ios-strings.py"
      - "scripts/ios-release-version.sh"
      - ".github/workflows/mobile.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    tags: ["ios-v*"]
    paths:
      - "android/**"
      - "ios/**"
      - "crates/library-ffi/**"
      - "crates/app-service/**"
      - "crates/library-native/**"
      - "crates/library-core/**"
      - "crates/media/**"
      - "scripts/check-mobile-shell.sh"
      - "scripts/check-ios-strings.py"
      - "scripts/ios-release-version.sh"
      - ".github/workflows/mobile.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host FFI + layout. Windows `CI` already runs cargo test --workspace (includes
  # library-ffi); this job is a fast Linux gate for mobile PRs.
  library-ffi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libheif (HEIC/HEIF, D-063)
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev pkg-config

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-library-ffi-v1
          workspaces: ". -> target"

      - name: Mobile shell layout + header sync
        run: bash scripts/check-mobile-shell.sh

      - name: library-ffi fmt
        run: cargo fmt -p library-ffi -- --check

      - name: library-ffi clippy
        run: cargo clippy -p library-ffi --all-targets -- -D warnings

      - name: library-ffi tests
        run: cargo test -p library-ffi

  # Android A1 (D-101): eglcore unit tests + assembleDebug with a real arm64 .so
  # (cargo-ndk). No mock core. NDK is required only when the .so is present.
  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      CARGO_NDK_VERSION: "3.5.6"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Hosted ubuntu runners already ship an Android SDK. Avoid
      # android-actions/setup-android's default `sdkmanager tools` install —
      # the legacy `tools` package was removed from the repository.
      - name: Android SDK + NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK" ]]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -z "$SDKMANAGER" && -x "$SDK/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}"
          NDK="$SDK/ndk/${ANDROID_NDK_VERSION}"
          if [[ ! -d "$NDK" ]]; then
            echo "NDK not installed at $NDK" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Rust toolchain + Android target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-android-ffi-v1
          workspaces: ". -> target"

      - name: Build libegl_library.so (arm64-v8a)
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -o android/eglcore/src/main/jniLibs \
            build -p library-ffi --release
          test -f android/eglcore/src/main/jniLibs/arm64-v8a/libegl_library.so

      - name: Gradle unit tests + assembleDebug (real core)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :eglcore:testDebugUnitTest :app:testDebugUnitTest \
            :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # EglCore (ios/EglCore, D-092): the Swift wrapper over the C ABI, tested on the macOS host
  # against the real Rust core (library-ffi over app-service), built as a dylib here.
  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: libheif (HEIC/HEIF previews on the host, D-063)
        run: brew install libheif

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-ios-core-v1
          workspaces: ". -> target"

      - name: Build libegl_library (host)
        run: cargo build -p library-ffi --release

      - name: swift test (EglCore against the core)
        working-directory: ios/EglCore
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/target/release"
          swift test -Xlinker -L"$LIB" -Xlinker -rpath -Xlinker "$LIB"

  # The app on a simulator with the real core (D-093): the project generated by XcodeGen,
  # the Rust core as a static library for arm64 simulators, unit and UI tests.
  ios-app:
    runs-on: macos-latest
    env:
      XCODEGEN_VERSION: "2.42.0"
    steps:
      - uses: actions/checkout@v7

      - name: XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain + iOS simulator target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-ios-sim-v1
          workspaces: ". -> target"

      - name: libegl_library.a (aarch64-apple-ios-sim)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          set -euo pipefail
          cargo rustc -p library-ffi --release --target aarch64-apple-ios-sim --crate-type staticlib
          # Only the static library: a dylib next to it would be linked and not embedded.
          rm -f target/aarch64-apple-ios-sim/release/libegl_library.dylib

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: xcodebuild test (simulator)
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl list runtimes | head -20
          DEVICE="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$DEVICE" && test "$DEVICE" != "null"
          xcodebuild test \
            -project EglViewer.xcodeproj \
            -scheme EglViewer \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

  # Device build with the real Rust core, unsigned, packed as an .ipa for sideloading
  # (D-086). Published to the rolling `ios-latest` pre-release on main pushes and manual runs.
  ios-ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      XCODEGEN_VERSION: "2.42.0"
    steps:
      - uses: actions/checkout@v7

      - name: XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Rust toolchain + iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-ios-device-v1
          workspaces: ". -> target"

      - name: libegl_library.a (aarch64-apple-ios)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          set -euo pipefail
          cargo rustc -p library-ffi --release --target aarch64-apple-ios --crate-type staticlib
          rm -f target/aarch64-apple-ios/release/libegl_library.dylib

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # A release tag sets the version (ios-v1.2.3 → 1.2.3) and the build number (the run
      # number); other builds keep the versions of project.yml.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            VERSION="$(bash scripts/ios-release-version.sh "$GITHUB_REF_NAME")"
            echo "settings=MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "settings=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: xcodebuild archive (iphoneos, no signing)
        working-directory: ios
        env:
          VERSION_SETTINGS: ${{ steps.version.outputs.settings }}
        run: |
          set -euo pipefail
          # Word splitting on purpose: zero or two build settings.
          # shellcheck disable=SC2086
          xcodebuild \
            -project EglViewer.xcodeproj \
            -scheme EglViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EglViewer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            $VERSION_SETTINGS \
            archive

      - name: Pack unsigned .ipa
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/EglViewer.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$APP"
          # The app carries its icon, privacy manifest and the version of the tag.
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "version $SHORT ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          if [[ -n "$EXPECTED" && "$SHORT" != "$EXPECTED" ]]; then
            echo "the app says $SHORT, the tag $EXPECTED" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/EglViewer.ipa" Payload)
          ls -lh EglViewer.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: EglViewer.ipa
          if-no-files-found: error

      - name: Publish ios-latest pre-release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Unsigned iOS build from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Sideload only."
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest EglViewer.ipa --clobber
            gh release edit ios-latest --notes "$NOTES" --prerelease
          else
            gh release create ios-latest EglViewer.ipa --prerelease --title "iOS latest (unsigned)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

  # A release tag `ios-vX.Y.Z`: once the core, the app's tests and the device build pass, a
  # GitHub Release with the unsigned IPA and its checksum (D-100). It is never marked as the
  # latest release: the desktop updater reads releases/latest (D-062).
  ios-release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: [ios-core, ios-app, ios-ipa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(bash scripts/ios-release-version.sh "$GITHUB_REF_NAME")"
          IPA="EglViewer-$VERSION.ipa"
          mv EglViewer.ipa "$IPA"
          sha256sum "$IPA" > SHA256SUMS
          # The previous iOS tag, for the list of changes.
          PREVIOUS="$(git tag --list 'ios-v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)"
          {
            echo "egl-viewer for iPhone $VERSION, built from ${GITHUB_SHA::7}."
            echo
            # The notes of the version, shared with the desktop release, when there are any.
            if [[ -f "docs/releases/$VERSION.md" ]]; then
              cat "docs/releases/$VERSION.md"
              echo
            fi
            echo "The IPA is **unsigned**: sign it with your own Apple ID when you install it"
            echo "(AltStore, SideStore, Sideloadly or Xcode). See ios/README.md, \"Install\"."
            echo
            echo "Check the download: \`sha256sum -c SHA256SUMS\`."
          } > notes.md
          ARGS=(--title "egl-viewer for iPhone $VERSION" --notes-file notes.md --verify-tag --latest=false)
          if [[ -n "$PREVIOUS" ]]; then
            ARGS+=(--generate-notes --notes-start-tag "$PREVIOUS")
          fi
          gh release create "$GITHUB_REF_NAME" "$IPA" SHA256SUMS "${ARGS[@]}"
