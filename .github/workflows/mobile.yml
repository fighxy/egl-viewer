name: Mobile

# Experimental iOS / Android shells + library-ffi (D-082–D-084).
# Parallel to the Windows desktop `CI` workflow; does not replace it.
on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "crates/library-ffi/**"
      - "crates/app-service/**"
      - "crates/library-native/**"
      - "crates/library-core/**"
      - "crates/media/**"
      - "scripts/check-mobile-shell.sh"
      - ".github/workflows/mobile.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "crates/library-ffi/**"
      - "crates/app-service/**"
      - "crates/library-native/**"
      - "crates/library-core/**"
      - "crates/media/**"
      - "scripts/check-mobile-shell.sh"
      - ".github/workflows/mobile.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host FFI + layout. Windows `CI` already runs cargo test --workspace (includes
  # library-ffi); this job is a fast Linux gate for mobile PRs.
  library-ffi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libheif (HEIC/HEIF, D-063)
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev pkg-config

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-library-ffi-v1
          workspaces: ". -> target"

      - name: Mobile shell layout + header sync
        run: bash scripts/check-mobile-shell.sh

      - name: library-ffi fmt
        run: cargo fmt -p library-ffi -- --check

      - name: library-ffi clippy
        run: cargo clippy -p library-ffi --all-targets -- -D warnings

      - name: library-ffi tests
        run: cargo test -p library-ffi

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Hosted ubuntu runners already ship an Android SDK. Avoid
      # android-actions/setup-android's default `sdkmanager tools` install —
      # the legacy `tools` package was removed from the repository.
      - name: Android SDK env + platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK" ]]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # Prefer cmdline-tools/*/bin/sdkmanager when present.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -z "$SDKMANAGER" && -x "$SDK/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle assembleDebug (mock FFI, no NDK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # EglCore (ios/EglCore, D-092): the Swift wrapper over the C ABI, tested on the macOS host
  # against the real Rust core (library-ffi over app-service), built as a dylib here.
  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: libheif (HEIC/HEIF previews on the host, D-063)
        run: brew install libheif

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-ios-core-v1
          workspaces: ". -> target"

      - name: Build libegl_library (host)
        run: cargo build -p library-ffi --release

      - name: swift test (EglCore against the core)
        working-directory: ios/EglCore
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/target/release"
          swift test -Xlinker -L"$LIB" -Xlinker -rpath -Xlinker "$LIB"

  # Shared scheme + unsigned iphonesimulator build (mock FFI, no libegl_library.a).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version && xcrun simctl list runtimes | head -20

      - name: xcodebuild (iphonesimulator, no signing)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project EglViewer.xcodeproj \
            -scheme EglViewer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

  # Device build with the real Rust core (EGL_HAS_FFI), unsigned, packed as an
  # .ipa for sideloading (D-086). Published to the rolling `ios-latest`
  # pre-release on main pushes and manual runs.
  ios-ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain + iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mobile-ios-device-v1
          workspaces: ". -> target"

      - name: Build libegl_library.a (aarch64-apple-ios)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        run: cargo build -p library-ffi --release --target aarch64-apple-ios

      - name: xcodebuild archive (iphoneos, no signing, FFI linked)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project EglViewer.xcodeproj \
            -scheme EglViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -xcconfig EglViewer/Config/WithFfi.xcconfig \
            -archivePath "$RUNNER_TEMP/EglViewer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            archive

      - name: Pack unsigned .ipa
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/EglViewer.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/EglViewer.ipa" Payload)
          ls -lh EglViewer.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: EglViewer.ipa
          if-no-files-found: error

      - name: Publish ios-latest pre-release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Unsigned iOS build from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Sideload only."
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest EglViewer.ipa --clobber
            gh release edit ios-latest --notes "$NOTES" --prerelease
          else
            gh release create ios-latest EglViewer.ipa --prerelease --title "iOS latest (unsigned)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
