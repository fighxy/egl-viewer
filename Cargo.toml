[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Exact versions, chosen as the latest stable releases on 2026-10-28.
# Cargo.lock is committed; update deliberately and record it in docs/decisions.md.
[workspace.dependencies]
library-core = { path = "crates/library-core" }
library-native = { path = "crates/library-native" }
media = { path = "crates/media" }
eagle-api = { path = "crates/eagle-api" }
app-store = { path = "crates/app-store" }

age = { version = "0.12.1", default-features = false }
arboard = "3.7.0"
argon2 = "0.6.0"
async-trait = "0.1.92"
bip39 = { version = "3.0.0", default-features = false, features = ["std"] }
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
drag = "2.1.1"
fast_image_resize = "6.1.0"
getrandom = "0.4.3"
icu_collator = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
psd = "0.3.5"
rayon = "1.12.0"
resvg = "0.49.0"
rusqlite = { version = "0.41.0", features = ["backup", "bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
ulid = "3.0.0"
webp = { version = "0.3.1", default-features = false }
winreg = "0.56.0"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true

# Locked folders run Argon2id (64 MiB) and X25519 on every unlock and item: unoptimised, a debug
# build and the tests take seconds per key. Only these crates are optimised in dev builds.
[profile.dev.package]
age.opt-level = 3
age-core.opt-level = 3
argon2.opt-level = 3
blake2.opt-level = 3
chacha20.opt-level = 3
chacha20poly1305.opt-level = 3
curve25519-dalek.opt-level = 3
poly1305.opt-level = 3
x25519-dalek.opt-level = 3
