[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party crates (D-148): built as dependencies, not linted or tested as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.2.77"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Exact versions, chosen as the latest stable releases on 2026-10-28.
# Cargo.lock is committed; update deliberately and record it in docs/decisions.md.
[workspace.dependencies]
library-core = { path = "crates/library-core" }
library-native = { path = "crates/library-native" }
media = { path = "crates/media" }
eagle-api = { path = "crates/eagle-api" }
eagle-folder = { path = "crates/eagle-folder" }
app-store = { path = "crates/app-store" }
app-service = { path = "crates/app-service" }
desktop-session = { path = "crates/desktop-session" }

age = { version = "0.12.1", default-features = false }
age-core = "0.12.0"
arboard = "3.7.0"
argon2 = "0.6.0"
base64 = "0.22.1"
bech32 = "0.11.1"
async-trait = "0.1.92"
bip39 = { version = "3.0.0", default-features = false, features = ["std"] }
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
drag = "2.1.1"
fast_image_resize = "6.1.0"
device_query = "=4.0.1"
getrandom = "0.4.3"
gpui-kit = "=0.9.1"
icu_collator = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
keyring = "4.2.0"
libheif-rs = { version = "2.6.1", default-features = false, features = ["v1_17"] }
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
psd = "0.3.5"
rand = "0.8.8"
rayon = "1.12.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
resvg = "0.49.0"
rusqlite = { version = "0.41.0", features = ["backup", "bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["aes256", "compress"] }
sha2 = "0.10.9"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.4"
webp = { version = "0.3.1", default-features = false }
winreg = "0.56.0"
# Windows resources (the exe icon) for gpui-desktop (D-144).
embed-resource = "3.0.12"
wiremock = "0.6.3"
yubikey = { version = "0.8.0", features = ["untested"] }
zip = { version = "9.2.0", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
zeroize = "1.9.1"

[workspace.lints.rust]
# Deny (not forbid) so a Windows WebAuthn bridge can call webauthn.dll behind a
# crate that contains unsafe; application crates still avoid writing unsafe.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true

# Locked folders run Argon2id (64 MiB) and X25519 on every unlock and item: unoptimised, a debug
# build and the tests take seconds per key. Only these crates are optimised in dev builds.
[profile.dev.package]
age.opt-level = 3
age-core.opt-level = 3
argon2.opt-level = 3
blake2.opt-level = 3
chacha20.opt-level = 3
chacha20poly1305.opt-level = 3
curve25519-dalek.opt-level = 3
poly1305.opt-level = 3
x25519-dalek.opt-level = 3

# Image decoders: an unoptimised debug build takes seconds to decode one large photo, which
# made the full-size preview feel slow in `cargo run` (D-143).
fdeflate.opt-level = 3
gif.opt-level = 3
image.opt-level = 3
image-webp.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
simd-adler32.opt-level = 3
tiff.opt-level = 3
weezl.opt-level = 3
zune-core.opt-level = 3
zune-inflate.opt-level = 3
zune-jpeg.opt-level = 3

# GPUI's Windows backend with the open / closed hand cursors loaded from the exe's resources
# (D-148). Same version as the lock; re-apply the patch when gpui-kit moves to a newer one.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
