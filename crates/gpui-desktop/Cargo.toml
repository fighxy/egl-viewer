[package]
name = "gpui-desktop"
description = "GPUI Kit desktop host over desktop-session (D-126–D-133); dual path beside Tauri until cutover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "gpui-desktop"
path = "src/main.rs"

[dependencies]
app-store.workspace = true
arboard.workspace = true
desktop-session.workspace = true
device_query.workspace = true
gpui-kit.workspace = true
image.workspace = true
library-core.workspace = true
library-native.workspace = true
media.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
# Same pin as desktop-session WebAuthn (D-032 / D-134); shell reveal only.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
# The exe icon: GPUI loads icon resource 1 for its windows and the taskbar (D-144).
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
