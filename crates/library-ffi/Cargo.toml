[package]
name = "library-ffi"
description = "C ABI shell over library-native for experimental iOS/Android clients (D-082 / D-083 / D-085)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "egl_library"
# rlib for host tests; staticlib for iOS (D-082); cdylib for Android .so (D-083).
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
library-core.workspace = true
library-native.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
image.workspace = true
media = { workspace = true, features = ["fixtures"] }
tempfile.workspace = true

[lints]
workspace = true
