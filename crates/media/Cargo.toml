[package]
name = "media"
description = "Dimensions, thumbnails, palettes and EXIF of the files in a native library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
fast_image_resize.workspace = true
image.workspace = true
kamadak-exif.workspace = true
library-core.workspace = true
psd.workspace = true
resvg.workspace = true
serde_json.workspace = true
thiserror.workspace = true
webp.workspace = true
# Video posters and audio lengths through FFmpeg (D-168), behind the `video` feature (D-181).
av = { workspace = true, optional = true }

# No system libheif on iOS or Android; HEIC keeps the placeholder until a platform
# decoder is installed (D-086 iOS ImageIO; Android gallery HEIC lands in A4).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
libheif-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Small files of every v1 format, made on the fly, for this crate's tests and library-native's.
fixtures = []
# Video posters and audio lengths through FFmpeg (D-181). Only the desktop app turns it on:
# the iOS and Android core (library-ffi) builds without FFmpeg, on the host too.
video = ["dep:av"]

[lints]
workspace = true
