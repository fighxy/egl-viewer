# The Xcode project is generated from this file (D-093): `xcodegen generate` in ios/ writes
# EglViewer.xcodeproj, which is not committed. CI pins XcodeGen's version (mobile.yml).
#
# The app links the Rust core (crates/library-ffi) as a static library built for the
# destination: `cargo rustc -p library-ffi --release --crate-type staticlib --target
# aarch64-apple-ios` (device) or `--target aarch64-apple-ios-sim` (simulator).
name: EglViewer
options:
  bundleIdPrefix: app.eglviewer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  EglCore:
    path: EglCore
settings:
  base:
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # The core is built for arm64 simulators only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  EglViewer:
    type: application
    platform: iOS
    sources:
      - path: EglViewer
    dependencies:
      - package: EglCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eglviewer.ios
        PRODUCT_NAME: EglViewer
        INFOPLIST_FILE: EglViewer/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(inherited) $(PROJECT_DIR)/../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(inherited) $(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: $(inherited) -lc++ -framework SystemConfiguration -framework Security
  EglViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EglViewerTests
    dependencies:
      - target: EglViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.eglviewer.ios.tests
  EglViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EglViewerUITests
    dependencies:
      - target: EglViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.eglviewer.ios.uitests
        TEST_TARGET_NAME: EglViewer
schemes:
  EglViewer:
    build:
      targets:
        EglViewer: all
    test:
      targets:
        - EglViewerTests
        - EglViewerUITests
      gatherCoverageData: false
